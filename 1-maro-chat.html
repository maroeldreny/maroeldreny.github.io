$('#attachment').onchange=()=>{const f=$('#attachment').files[0],p=$('#attachment-preview');p.replaceChildren();p.hidden=!f;if(fileUrl)URL.revokeObjectURL(fileUrl);if(f){if(f.size>2000000||!['image/png','image/jpeg','image/webp'].includes(f.type)){$('#status').textContent='اختار صورة PNG أو JPG أو WebP أقل من ٢ ميجا.';$('#attachment').value='';p.hidden=true;return}fileUrl=URL.createObjectURL(f);const i=document.createElement('img');i.src=fileUrl;i.alt='معاينة المرفق';p.append(i,document.createTextNode(f.name))}};
$('.quick-actions').querySelectorAll('button').forEach((b,i)=>{b.style.setProperty('--i',i);b.onclick=()=>{if(sending)return;text.value=b.dataset.prompt;update();$('#composer').requestSubmit()}});
$('#composer').onsubmit=async e=>{e.preventDefault();if(sending||!text.value.trim())return;sending=true;update();const message=text.value,f=$('#attachment').files[0];$('#status').textContent='';$('#typing').hidden=false;chat.classList.add('thinking');setState('thinking');$('.quick-actions').querySelectorAll('button').forEach(b=>b.disabled=true);scroll();const pending=document.createElement('article');pending.className='user';pending.textContent=message;$('#messages').append(pending);scroll();try{await session();let attachment,preview;if(f){const data=await new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=no;r.readAsDataURL(f)});preview=data;attachment={mime_type:f.type,data:data.split(',')[1]}}const r=await fetch(endpoint+'/api/chat',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token,'x-csrf-token':csrf},body:JSON.stringify({message,attachment})});const d=await r.json();if(!r.ok)throw Error(d.error||'تعذر إكمال الرد. تقدر تحاول تاني.');if(preview){const im=document.createElement('img');im.src=preview;im.alt='الصورة المرفقة برسالتك';pending.append(im)}add(d.text,'bot');if(d.handoff)handoff(d.handoff);setState('response');setTimeout(()=>{if(chat.dataset.state==='response')setState('idle')},1400);if(text.value===message)text.value='';$('#attachment').value='';$('#attachment-preview').hidden=true;$('.quick-actions').style.display='none'}catch(x){setState('error');pending.remove();$('#status').textContent=x.message}finally{sending=false;$('#typing').hidden=true;chat.classList.remove('thinking');$('.quick-actions').querySelectorAll('button').forEach(b=>b.disabled=false);update();scroll()}};
})();
</script></body></html>
